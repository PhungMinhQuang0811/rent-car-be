server:
  port: 8080
  servlet:
    context-path: /karental

application:
  domain-name: localhost
  email: ${APPLICATION_EMAIL}
  security:
    jwt:
      access-token-secret-key: ${JWT_ACCESS_SECRET_KEY}
      access-token-cookie-name: karental-jwt
      refresh-token-cookie-name: karental-jwt-refresh
      refresh-token-secret-key: ${JWT_REFRESH_SECRET_KEY}
      access-token-expiration: 3600000  #milisecond ~ 1 hours
      refresh-token-expiration: 432000000 #~5day
      csrf-token-cookie-name: karental-jwt-csrf
      csrf-token-secret-key: ${JWT_CSRF_SECRET_KEY}
      csrf-token-header-name: X-CSRF-TOKEN
#      access-token-expiration: 15000 #milisecond ~ 15s
#      refresh-token-expiration: 60000 #~1 minute
    public-endpoints:
      "/user/register,
      /user/check-unique-email,
      /user/resend-verify-email/**,
      /user/verify-email/**,
      /auth/**,
      /homepage/**,
      /api/v1/payments/vnpay_ipn,
      /api/v1/payments/vnpay_return/**"
##      FOR TEST

front-end:
  base-url: http://localhost:3000

spring:
  profiles:
    active: dev
  application:
    name: karental
  datasource:
    url: jdbc:mysql://localhost:3306/karental
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 6000
      database: 0

springdoc:
  swagger-ui:
    enabled: false
cloud:
  aws:
    region:
      static: ap-southeast-1
    s3:
      buckets:
        name: karental

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    folder-name: karental
payment:
  vnpay:
    tmn-code: ${TMN_CODE}
    secret-key: ${VNPAY_SECRET_KEY}
    init-payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    # IMPORTANT: Return URL and IPN URL must be publicly accessible!
    # For local development, use ngrok or similar tunneling service
    # Example: https://your-ngrok-url.ngrok.io/karental/api/v1/payments/vnpay_return/%s
    return-url: ${VNPAY_RETURN_URL:https://unturbaned-untaxing-micki.ngrok-free.dev/karental/api/v1/payments/vnpay_return/%s}
    timeout: 15 # in minutes
    # Bank code is not configured - VNPay will show payment method selection page to users
